# Next.js RSC payloads (text/x-component) must never be reused by browser caches:
# a cached RSC stream replayed for a normal navigation + nosniff => download prompt.
map $upstream_http_content_type $rsc_aware_cache_control {
    "~^text/x-component"  "no-store";
    default               $upstream_http_cache_control;
}
