name: Deploy preview

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: residency-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    env:
      NEXT_PUBLIC_BASE_PATH: /residency

    steps:
      - name: Check out mirrored source
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checks
        run: pnpm typecheck

      - name: Build standalone application
        run: pnpm build

      - name: Assemble release
        run: |
          set -euo pipefail
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public
          printf '%s\n' "${GITHUB_SHA}" > release/REVISION
          tar -C release -czf residency-preview.tar.gz .

      # The exe.dev edge proxy cuts request bodies that stream for more than a
      # few minutes, so the release travels as small numbered parts. The
      # receiver reassembles them, verifies the whole-archive sha256, and
      # activates on the final part.
      - name: Upload and activate release
        env:
          PREVIEW_DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          PREVIEW_DEPLOY_URL: ${{ secrets.PREVIEW_DEPLOY_URL }}
        run: |
          set -euo pipefail
          sha256=$(sha256sum residency-preview.tar.gz | cut -d' ' -f1)
          split -b 8m -d -a 3 residency-preview.tar.gz part.
          parts=(part.*)
          total=${#parts[@]}
          index=0
          for part in "${parts[@]}"; do
            curl --http1.1 --fail --silent --show-error \
              --max-time 150 \
              --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${PREVIEW_DEPLOY_TOKEN}" \
              -H "X-Revision: ${GITHUB_SHA}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${part}" \
              "${PREVIEW_DEPLOY_URL}/__deploy/residency/part?index=${index}&total=${total}&sha256=${sha256}"
            index=$((index + 1))
          done

      - name: Verify public preview
        env:
          PREVIEW_URL: ${{ secrets.PREVIEW_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "${PREVIEW_URL}/residency" >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            "${PREVIEW_URL}/residency/admin/login" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            "${PREVIEW_URL}/residency/api/inbound-email-sync")" = "401"
